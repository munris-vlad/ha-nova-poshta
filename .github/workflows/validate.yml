name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp tzdata
      - run: python -m unittest discover -s tests -p test_api.py -v
      - run: python -m unittest discover -s tests -p test_translations.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/nova_poshta_account/frontend/nova-poshta-account-card.js
      - run: node --test tests/card.test.cjs
